modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = '''
A lore archive for modpacks: entries unlock as players progress and are readable in an in-game book.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_wiki"
type = "required"
versionRange = "[0.5.8,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbquests"
type = "optional"
versionRange = "[2101.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gtceu"
type = "optional"
versionRange = "[8.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_chromatic_codes"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_chronicles"
type = "optional"
versionRange = "[10.0.0,)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "phoenix_archive.mixins.json"
