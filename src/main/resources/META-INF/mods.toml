modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

# This is a URL to e.g. your GitHub or CurseForge issues page.
# It will appear in any crash reports this mod is directly involved in.
# issueTrackerURL="https://github.com/invalid/pleasechangeme/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader

[[mods]]
modId = "phoenix_archive"
version = "${version}"
displayName = "PhoenixArchive"
displayURL = "${mod_url}"
# This will be displayed as your mod's logo in the Mods panel.
# logoFile="icon.png" #optional
# Some more fluff displayed in the Mods panel. Feel free to issue your special thanks here!
# credits="Thanks to Mojang for making this great game" #optional
# Some more fluff displayed in the Mods panel. Plug your stuff here!
authors="${mod_author}"
description = '''This is the Core mod for phoenix_core'''

[[dependencies.phoenix_archive]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.phoenix_archive]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.phoenix_archive]]
modId = "ftbquests"
mandatory = false
versionRange = "[2001.0.0,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.phoenix_archive]]
modId = "gregtech"
mandatory = false
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.phoenix_archive]]
modId = "phoenix_chromatic_codes"
mandatory = false
versionRange = "[0,)" # This tells Forge "any version from 0.0.0 upwards"
ordering = "AFTER"
side = "BOTH"